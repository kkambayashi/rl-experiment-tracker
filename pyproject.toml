[project]
name = "rl-experiment-tracker"
version = "0.2.0"
description = "SRS_v2 (HandyRL) の trainlog から、保存した図と実行回数をまとめて確認する最小の Streamlit アプリ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["streamlit>=1.30"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["test_scan.py"]   # archive_v1/ 以下の古いテストは拾わない
pythonpath = ["."]
