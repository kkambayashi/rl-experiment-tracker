[project]
name = "rl-experiment-tracker"
version = "0.1.0"
description = "強化学習 (SRS_v2 / HandyRL) の実験バックアップをローカルで検索・比較する Streamlit アプリ"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.30",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "altair>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

# アプリであってライブラリではないので、パッケージとしてビルド/インストールはしない。
# uv はこの設定で「仮想環境を作って依存だけ入れる」動作になる。
[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
